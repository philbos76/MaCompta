/* ---------- Connexion et synchronisation Supabase ---------- */

function choose(m,la,fa,lb,fb){$('#dlg').innerHTML='<b>Conflit de synchronisation</b><p style="white-space:pre-line"></p><div class="row"><button class="b p" id="ca"></button><button class="b" id="cb"></button></div>';$('#dlg p').textContent=m;$('#ca').textContent=la;$('#cb').textContent=lb;$('#ca').onclick=()=>{$('#dlg').close();fa()};$('#cb').onclick=()=>{$('#dlg').close();fb()};shw()}
function adopt(r){S=r;norm();setDirty(false);persist();render();sy('Synchronisé')}
function conflict(rem,ver){RVER=ver;choose('Ce budget a été modifié sur un autre appareil alors que vous aviez des modifications non synchronisées.\n\nQue faire ?','Garder cet appareil',push,'Récupérer le cloud',()=>adopt(rem))}
async function pushConflict(){const r=await SB.from(TABLE).select('data,version').eq('user_id',USER.id).maybeSingle();if(r.error){sy('Erreur de synchro');return}if(!r.data){RVER=0;return push()}conflict(r.data.data||{},r.data.version)}
async function push(){if(!USER||!SB)return;if(PUSHING){AGAIN=true;return}if(!navigator.onLine){sy('Hors ligne : synchronisation en attente');return}
PUSHING=true;const ts=S.ts;let again=false;
try{const r=RVER?await SB.from(TABLE).update({data:S}).eq('user_id',USER.id).eq('version',RVER).select('version'):await SB.from(TABLE).insert({user_id:USER.id,data:S}).select('version');

if(!r.data||!r.data.length){await pushConflict();return}
RVER=r.data[0].version;if(S.ts==ts){setDirty(false);sy('Synchronisé')}else again=true}
catch(e){sy('Erreur de synchro : données gardées sur cet appareil')}

async function pull(man){if(!USER||!SB)return;LASTPULL=Date.now();if(!navigator.onLine){sy('Hors ligne');if(man)note('Hors ligne : synchronisation impossible pour le moment.');return}
try{const r=await SB.from(TABLE).select('data,version').eq('user_id',USER.id).maybeSingle();if(r.error)throw r.error;
const has=S.lines.length||S.tx.length,rem=r.data&&r.data.data,ok=rem&&Array.isArray(rem.acc)&&Array.isArray(rem.lines);
if(!r.data||!ok){RVER=r.data?r.data.version:0;if(has){await push();if(man)note('Données envoyées vers le cloud.',true)}else{sy('Synchronisé');if(man)note('Aucune donnée dans le cloud pour le moment : importez une sauvegarde (Réglages) ou commencez à saisir.',true)}return}
RVER=r.data.version;const rts=rem.ts||0,lts=S.ts||0;
if(!has||(!DIRTY&&rts>lts)){adopt(rem);if(man)note('Données récupérées depuis le cloud ('+S.lines.length+' lignes de budget).',true)}

async function initAuth(){
if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(SUPABASE_URL)||!SUPABASE_ANON_KEY||/VOTRE|YOUR/i.test(SUPABASE_URL+SUPABASE_ANON_KEY)){showLogin('config');return}

<h2>Partie 2 · Comment saisir vos données</h2>
<div class="card"><h3><span class="num">1</span>Réglages (une seule fois)</h3><ul class="hl"><li><b>Premier mois du budget</b> : le début des 12 mois suivis.</li><li><b>Comptes</b> : un nom et un <b>solde d'ouverture</b> (le solde au 1er jour du premier mois). Laissez vide un compte inutilisé.</li><li><b>Seuil d'alerte</b> de chaque compte : soit un <b>montant fixe</b> (alerte si le solde passe dessous), soit la <b>projection budgétée</b> (alerte si le solde passe sous ce que prévoyait le budget, avec une marge de tolérance au choix).</li><li><b>Catégories</b> (jusqu'à 20) et jusqu'à 5 <b>sous-catégories</b> chacune, par exemple Logement › Loyer.</li></ul></div>
<div class="card"><h3><span class="num">2</span>Budget : une ligne par poste prévu</h3><p>Touchez « + Ligne de budget », choisissez le type, la catégorie, le compte, puis saisissez le montant de chaque mois (ou « Même montant partout »).</p>${ex(['Nom','Type','Catégorie › sous-catégorie','Compte','Montant'],[['Salaire','Revenu','Salaire › Salaire net','Compte courant','5 000 par mois'],['Loyer','Dépense','Logement › Loyer','Compte courant','1 600 par mois'],['Épargne','Virement','—','De Compte courant vers Compte épargne','500 par mois']])}<ul class="hl"><li>Les montants sont <b>toujours positifs</b> : c'est le type qui donne le sens.</li><li>Un <b>virement</b> déplace de l'argent d'un compte (source) vers un autre (destination) : ce n'est ni un revenu, ni une dépense.</li><li>Un montant à 0 signifie « rien de prévu ce mois-là ».</li></ul></div>
<div class="card"><h3><span class="num">3</span>Saisie : chaque opération réelle</h3><p>Pour chaque mouvement sur vos comptes : la date, le type, la <b>ligne budgétaire</b> correspondante, le compte, le montant (positif) et un libellé.</p>${ex(['Date','Type','Ligne budgétaire','Compte','Montant'],[['03/10','Dépense','Loyer','Compte courant','1 600'],['05/10','Virement','Épargne','De Compte courant vers Compte épargne','500'],['12/10','Dépense','Hors budget (imprévu)','Compte courant','120']])}<ul class="hl"><li>Choisir la ligne remplit automatiquement le compte.</li><li>Une opération nouvellement saisie est <b>non comptée</b> par défaut : cochez la case devant elle pour l'intégrer au Suivi et à la Projection.</li><li>Pour une dépense qui revient tous les mois, cochez « Répéter chaque mois » : les occurrences sont créées jusqu'à la fin de l'exercice (week-ends : jour ouvrable précédent).</li><li>Pour mettre une opération de côté sans la supprimer (par exemple si elle est à vérifier), décochez la case placée devant elle.</li><li>Pour un imprévu, choisissez « Hors budget » : il apparaîtra dans le Suivi sur une ligne à part.</li></ul></div>
<div class="card"><h3><span class="num">4</span>Chaque fin de mois</h3><ul class="hl"><li>Saisissez toutes les opérations du mois.</li><li>Dans <b>Réglages</b>, passez « Dernier mois réel intégré » à ce mois.</li><li>Ainsi, jusqu'à ce mois la Projection utilise <b>vos opérations réelles</b> ; ensuite elle utilise <b>le budget</b>.</li></ul></div>
<div class="card"><h3>Connexion et synchronisation</h3><ul class="hl"><li>L'application est <b>privée</b> : il faut se connecter (e-mail et mot de passe) pour accéder à vos données. Le bouton « Déconnexion » est en haut de l'écran.</li><li>Vos données sont enregistrées dans votre base <b>Supabase</b>, protégée par votre compte, et synchronisées entre vos appareils.</li><li>En cas de coupure réseau, vos modifications sont gardées sur l'appareil puis envoyées dès le retour de la connexion.</li></ul></div><div class="card"><h3>À savoir</h3><ul class="hl"><li>Ne saisissez pas de signe « moins » : le type s'en charge.</li><li>Une opération datée en dehors des 12 mois n'est pas comptée (un message vous le signale).</li><li>Une ligne sans catégorie est classée sous « Sans catégorie » : choisissez-lui une catégorie dans Budget.</li><li><b>Choisir le dossier d'un export</b> : sur Chrome ou Edge (ordinateur), une fenêtre « Enregistrer sous » s'ouvre. Sur Safari, Firefox ou téléphone, utilisez le menu de partage (Fichiers, OneDrive) ou le réglage du navigateur « Demander où enregistrer les fichiers ».</li><li>Vos données sont enregistrées sur l'appareil et synchronisées avec le cloud (Supabase). Pensez à faire une <b>sauvegarde</b> régulière dans Réglages.</li></ul></div>`}
